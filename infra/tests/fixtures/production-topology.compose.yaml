# Disposable Linux CI overlay for the real production Compose topology.
# It replaces only the external tunnel dependency with an isolated in-project
# stub and binds every persistent path to a trap-cleaned temporary directory.
services:
  postgres:
    pull_policy: never
    command:
      - postgres
      - -c
      - fsync=on
      - -c
      - synchronous_commit=on
      - -c
      - full_page_writes=on
      - -c
      - unix_socket_directories=/run/learncoding-postgres,/var/run/postgresql
      - -c
      - unix_socket_permissions=0700
    volumes:
      - type: bind
        source: ${TOPOLOGY_POSTGRES_DIR:?Set TOPOLOGY_POSTGRES_DIR}
        target: /var/lib/postgresql/data
      - type: bind
        source: ${TOPOLOGY_POSTGRES_SOCKET_DIR:?Set TOPOLOGY_POSTGRES_SOCKET_DIR}
        target: /run/learncoding-postgres
    healthcheck:
      test: ["CMD-SHELL", '[ "$$(cat /proc/1/comm)" = postgres ] && pg_isready -h /run/learncoding-postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  database-role-bootstrap:
    pull_policy: never

  migrate:
    pull_policy: never

  platform-seed:
    pull_policy: never

  admin-bootstrap:
    pull_policy: never

  app:
    pull_policy: never
    environment:
      UPLOADS_ENABLED: "false"
      MAIL_ADAPTER: outbox
      GOOGLE_CLIENT_ID: ""
    volumes:
      - type: bind
        source: ${TOPOLOGY_NEXT_CACHE_DIR:?Set TOPOLOGY_NEXT_CACHE_DIR}
        target: /app/.next/cache
      - type: bind
        source: ${TOPOLOGY_APP_DATA_DIR:?Set TOPOLOGY_APP_DATA_DIR}
        target: /var/lib/learncoding
    healthcheck:
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  mail-worker:
    pull_policy: never
    environment:
      # The worker dispatches only through console or gmail.
      MAIL_ADAPTER: console
      OUTBOX_POLL_SECONDS: "1"
    healthcheck: &worker-health
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  reward-worker:
    pull_policy: never
    environment:
      REWARD_POLL_SECONDS: "2"
    healthcheck: *worker-health

  regrade-worker:
    pull_policy: never
    environment:
      REGRADE_POLL_SECONDS: "2"
    healthcheck: *worker-health

  exam-finalization-worker:
    pull_policy: never
    environment:
      EXAM_FINALIZATION_POLL_SECONDS: "2"
    healthcheck: *worker-health

  practice-runner-recovery-worker:
    pull_policy: never
    environment:
      PRACTICE_RECOVERY_POLL_SECONDS: "2"
    healthcheck: *worker-health

  project-review-correction-worker:
    pull_policy: never
    environment:
      PROJECT_REVIEW_CORRECTION_POLL_SECONDS: "2"
    healthcheck: *worker-health

  cloudflared:
    image: ${APP_RUNTIME_IMAGE:?Set APP_RUNTIME_IMAGE}
    pull_policy: never
    entrypoint: []
    command:
      - node
      - -e
      - |
        const http = require('node:http');
        const server = http.createServer((_request, response) => {
          response.writeHead(204, { 'cache-control': 'no-store' });
          response.end();
        });
        server.listen(20241, '0.0.0.0');
        const stop = () => server.close(() => process.exit(0));
        process.once('SIGINT', stop);
        process.once('SIGTERM', stop);
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20241/ready').then((r) => { if (r.status !== 204) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s
    labels:
      io.codestead.fixture: production-topology-v1

networks:
  frontend:
    internal: true
  mail-egress:
    internal: true
  github-egress:
    internal: true
  signature-egress:
    internal: true
