# TEMPORARY determinism probe for fix/piston-cds-deterministic. Delete before merge.
name: Piston CDS probe
on:
  pull_request:
    paths: [.github/workflows/piston-cds-probe.yml, infra/piston/**]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci > npm-ci.log 2>&1 || { cat npm-ci.log; exit 1; }
      - run: node infra/piston/prepare.mjs > downloads.log 2>&1 || { tail -50 downloads.log; exit 1; }
      - name: Use the containerd image store
        run: |
          { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } \
            | jq '.features["containerd-snapshotter"] = true' > daemon.json
          sudo install -m 0644 daemon.json /etc/docker/daemon.json && rm daemon.json
          sudo systemctl restart docker
      - name: Build
        run: node infra/piston/build.mjs codestead-piston:ci > build.log 2>&1 || { tail -n 120 build.log; exit 1; }
      - name: Digest and file hashes
        run: |
          nproc; free -m | head -2
          jq -r '"DIGEST " + .["containerimage.digest"]' infra/piston/build-metadata.json
          docker run --rm --entrypoint /bin/sh codestead-piston:ci -c \
            'find /etc -xdev \( -type f -o -type l \) -print0 | sort -z | xargs -0 ls -l --time-style=+%s; find /etc -type f -print0 | sort -z | xargs -0 sha256sum; sha256sum /usr/local/jdk/lib/codestead.jsa' > hashes.txt
          sha256sum hashes.txt
          grep codestead.jsa hashes.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hashes-${{ github.run_attempt }}
          path: hashes.txt
