  # Each executable-tranche verifier runs in its own job against freshly built
  # local runtime images. A failed verifier regenerates and uploads its own
  # evidence file so the reviewed diff can be inspected.
  curriculum-verify:
    name: "curriculum: verify ${{ matrix.group }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.curriculum == 'true'
    env:
      RUNTIME_LOCAL_RISK_ACCEPTANCE: accept-unsigned-local-buildkit-provenance-v1
