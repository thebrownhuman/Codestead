      - run: POSTGRES_17_BIN=/usr/lib/postgresql/17/bin npm run test:mail-dispatch-binding-0064:pg17
      - run: POSTGRES_17_BIN=/usr/lib/postgresql/17/bin npm run test:backup-status-mail-authority-0065
      - run: POSTGRES_17_BIN=/usr/lib/postgresql/17/bin npm run test:mail-provider-correlation-0066:pg17
      - run: POSTGRES_17_BIN=/usr/lib/postgresql/17/bin npm run test:mail-durable-replay-0067:pg17
      - run: POSTGRES_17_BIN=/usr/lib/postgresql/17/bin npm run test:mail-retention-redaction-0068:pg17
      - run: POSTGRES_17_BIN=/usr/lib/postgresql/17/bin npm run test:mail-guarded-delivery-0069:pg17
      - run: POSTGRES_17_BIN=/usr/lib/postgresql/17/bin npm run test:restore-drill-role-boundary:pg17
      - run: POSTGRES_18_BIN=/usr/lib/postgresql/18/bin npm run test:mail-delivery-scope-0059
      - run: POSTGRES_18_BIN=/usr/lib/postgresql/18/bin npm run test:mail-payload-immutability-0060
      - run: POSTGRES_18_BIN=/usr/lib/postgresql/18/bin npm run test:mail-retention-redaction-0063
      - run: POSTGRES_18_BIN=/usr/lib/postgresql/18/bin npm run test:mail-dispatch-binding-0064:pg18
      - run: POSTGRES_18_BIN=/usr/lib/postgresql/18/bin npm run test:backup-status-mail-authority-0065
      - run: POSTGRES_18_BIN=/usr/lib/postgresql/18/bin npm run test:mail-provider-correlation-0066:pg18
      - run: POSTGRES_18_BIN=/usr/lib/postgresql/18/bin npm run test:mail-durable-replay-0067:pg18
      - run: POSTGRES_18_BIN=/usr/lib/postgresql/18/bin npm run test:mail-retention-redaction-0068:pg18
      - run: POSTGRES_18_BIN=/usr/lib/postgresql/18/bin npm run test:mail-guarded-delivery-0069:pg18
      - run: POSTGRES_18_BIN=/usr/lib/postgresql/18/bin npm run test:restore-drill-role-boundary:pg18

  # The other integration files run in five shards of the sorted file list
  # (shard k = files at 1-based positions p with p % 5 == k): shard 0 inside
  # postgres-integration, shards 1-4 here, each with its own disposable
  # database. backup-ci-registration proves the shards partition every file.
  postgres-integration-shards:
    name: "database: integration files (shard ${{ matrix.shard }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.database == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
