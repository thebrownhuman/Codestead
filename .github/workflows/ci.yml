        with:
          set-host: true
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - run: npm run runtime:build
        working-directory: services/runner
      - run: npm run runtime:inspect
        working-directory: services/runner
      - name: Read locked Playwright version
        run: node -e 'const fs = require("node:fs"); const version = require("./package-lock.json").packages["node_modules/playwright"].version; fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);'
        id: playwright-version
      # Cache archives only: apt still refreshes signed indexes and installs OS dependencies.
      - name: Prepare apt archive cache
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /var/cache/apt/archives
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          printf '%s\n' 'APT::Keep-Downloaded-Packages "true";' 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99-ci-cache >/dev/null
          printf 'image=%s\n' "$ImageVersion" >> "$GITHUB_OUTPUT"
        id: apt-cache-config
      - name: Cache apt archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt-cache-config.outputs.image }}-${{ steps.playwright-version.outputs.version }}-chromium
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-chromium
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
      - name: Install only OS dependencies on a browser cache hit
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
      - run: npm run ${{ matrix.verify }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && matrix.group == 'web'
        with:
          name: web-evidence-differing-candidate
          path: test-artifacts/web-executable-candidates/**/web-executable-runtime-2026-07-12.json
          if-no-files-found: warn
          retention-days: 14
      - name: Regenerate this group's runtime evidence after a failed verification
        run: npm run ${{ matrix.apply }}
        if: failure()
      - name: Upload this group's regenerated runtime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: ${{ matrix.group }}-evidence-regenerated
          path: ${{ matrix.evidence }}
          if-no-files-found: warn
          retention-days: 14

  # DSA parity executes every runtime case in two shards; the merge job then
  # requires every case exactly once and checks the single committed evidence.
  curriculum-dsa-parity:
    name: "curriculum: DSA parity (shard ${{ matrix.shard }}/2)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.curriculum == 'true'
    env:
      RUNTIME_LOCAL_RISK_ACCEPTANCE: accept-unsigned-local-buildkit-provenance-v1
      RUNTIME_SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
      RUNTIME_SOURCE_REVISION: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: services/runner
      - name: Set up Docker with containerd image store
        uses: docker/setup-docker-action@6d7cfa65f60a9dda7b46e5513fa982536f3c9877 # v5.3.0
        with:
          set-host: true
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - run: npm run runtime:build
        working-directory: services/runner
      - run: npm run runtime:inspect
        working-directory: services/runner
      - run: npm run dsa:parity:verify -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dsa-parity-shard-${{ matrix.shard }}
          path: services/runner/dist/dsa-parity-shards/
          if-no-files-found: error
          retention-days: 1

  curriculum-dsa-parity-merge:
    name: "curriculum: DSA parity (merge & evidence)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - changes
      - curriculum-dsa-parity
    if: needs.changes.outputs.curriculum == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dsa-parity-shard-*
          path: services/runner/dist/dsa-parity-shards
          merge-multiple: true
      - run: npm run dsa:parity:verify -- --merge-shards=2
      - name: Regenerate DSA parity runtime evidence after a failed verification
        run: npm run dsa:parity:evidence:apply -- --merge-shards=2
        if: failure()
      - name: Upload regenerated DSA parity runtime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: dsa-parity-evidence-regenerated
          path: docs/evidence/dsa-parity-runtime-*.json
          if-no-files-found: warn
          retention-days: 14

  auth-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Read locked Playwright version
        run: node -e 'const fs = require("node:fs"); const version = require("./package-lock.json").packages["node_modules/playwright"].version; fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);'
        id: playwright-version
      # Cache archives only: apt still refreshes signed indexes and installs OS dependencies.
      - name: Prepare apt archive cache
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /var/cache/apt/archives
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          printf '%s\n' 'APT::Keep-Downloaded-Packages "true";' 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99-ci-cache >/dev/null
          printf 'image=%s\n' "$ImageVersion" >> "$GITHUB_OUTPUT"
        id: apt-cache-config
      - name: Cache apt archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt-cache-config.outputs.image }}-${{ steps.playwright-version.outputs.version }}-${{ github.event_name == 'pull_request' && 'chromium' || 'chromium-firefox-webkit' }}
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-${{ github.event_name == 'pull_request' && 'chromium' || 'chromium-firefox-webkit' }}
      # Owner-approved trade-off: pull requests exercise the Chromium profile only;
      # main, nightly and dispatch run every browser durability profile.
      - run: npx playwright install --with-deps ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium firefox webkit' }}
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
      - name: Install only OS dependencies on a browser cache hit
        run: npx playwright install-deps ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium firefox webkit' }}
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
      - run: npm run test:browser:auth
        env:
          BROWSER_DURABILITY_PROFILES: ${{ github.event_name == 'pull_request' && 'chromium' || '' }}

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    # Owner-approved trade-off: pull requests run the Chromium project only, in
    # three shards; main, nightly and dispatch also run the five other projects.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"project":"chromium","browser":"chromium","shard":"1/3"},{"project":"chromium","browser":"chromium","shard":"2/3"},{"project":"chromium","browser":"chromium","shard":"3/3"}]' || '[{"project":"chromium","browser":"chromium","shard":"1/3"},{"project":"chromium","browser":"chromium","shard":"2/3"},{"project":"chromium","browser":"chromium","shard":"3/3"},{"project":"firefox","browser":"firefox","shard":"1/1"},{"project":"webkit","browser":"webkit","shard":"1/1"},{"project":"tablet-safari","browser":"webkit","shard":"1/1"},{"project":"small-mobile","browser":"webkit","shard":"1/1"},{"project":"mobile-safari","browser":"webkit","shard":"1/1"}]') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Read locked Playwright version
        run: node -e 'const fs = require("node:fs"); const version = require("./package-lock.json").packages["node_modules/playwright"].version; fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);'
        id: playwright-version
      # Cache archives only: apt still refreshes signed indexes and installs OS dependencies.
      - name: Prepare apt archive cache
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /var/cache/apt/archives
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          printf '%s\n' 'APT::Keep-Downloaded-Packages "true";' 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99-ci-cache >/dev/null
          printf 'image=%s\n' "$ImageVersion" >> "$GITHUB_OUTPUT"
        id: apt-cache-config
      - name: Cache apt archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt-cache-config.outputs.image }}-${{ steps.playwright-version.outputs.version }}-${{ matrix.browser }}
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-${{ matrix.browser }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
      - name: Install only OS dependencies on a browser cache hit
        run: npx playwright install-deps ${{ matrix.browser }}
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
      - run: npm run sync:monaco
      - run: npm run test:e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}

  # The single required check. It passes only when every job succeeded, or was
  # skipped because its own path filter was false (or it is a parked job).
  ci-ok:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - quick
      - unit
      - unit-coverage
      - build
      - docker-build
      - db-roles
      - infra-recovery
      - infra-release
      - infra-host
      - infra-sandbox
      - production-topology
      - application-images
      - backup-safety
      - backup-production-e2e
      - runner
      - postgres-integration
      - postgres-integration-shards
      - integration-mail-races
      - curriculum-runtime
      - curriculum-verify
      - curriculum-dsa-parity
      - curriculum-dsa-parity-merge
      - auth-browser
      - browser
    if: always()
    steps:
      - name: Require every job to pass or be skipped by its own filter
        run: |
          set -Eeuo pipefail
          gate_of() {
            case "$1" in
              infra-recovery|infra-release|infra-host|infra-sandbox) echo infra ;;
              production-topology) echo topology ;;
              application-images) echo images ;;
              runner) echo runner ;;
              curriculum-runtime|curriculum-verify|curriculum-dsa-parity|curriculum-dsa-parity-merge) echo curriculum ;;
              auth-browser|browser) echo browser ;;
              postgres-integration|postgres-integration-shards|integration-mail-races) echo database ;;
              *) echo '' ;;
            esac
          }
          status=0
          while IFS=$'\t' read -r job result; do
            if [[ "$result" == success ]]; then
              continue
            fi
            if [[ "$result" == skipped ]]; then
              if [[ "$job" == backup-safety || "$job" == backup-production-e2e ]]; then
                echo "$job is parked (if: false)"
                continue
              fi
              gate="$(gate_of "$job")"
              if [[ -n "$gate" && "$(jq -r --arg gate "$gate" '.changes.outputs[$gate] // ""' <<<"$NEEDS_JSON")" == false ]]; then
                echo "$job skipped: its $gate path filter is false"
                continue
              fi
            fi
            echo "::error::$job finished as $result"
            status=1
          done < <(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<<"$NEEDS_JSON")
          exit "$status"
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
