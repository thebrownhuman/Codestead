name: Application image registry release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Immutable release label (for example 20260719T120000Z-90a441c)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: application-image-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: application-image-registry
    env:
      APP_IMAGE_PUSH: "1"
      APP_IMAGE_RELEASE: ${{ inputs.release }}
      APP_IMAGE_REGISTRY: ghcr.io/thebrownhuman/codestead
      APP_IMAGE_SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
      APP_IMAGE_SOURCE_REVISION: ${{ github.sha }}
      APP_IMAGE_COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/application-image-registry-release.yml@refs/heads/main
      APP_IMAGE_COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Require main-branch publication
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Application image publication is restricted to refs/heads/main." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize the runner-local cache path
        run: |
          set -Eeuo pipefail
          printf 'APP_IMAGE_TRIVY_CACHE_DIR=%s/application-image-trivy-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Set up Docker with containerd image store
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.0
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.2
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: 0.69.3
      - run: npm run app-images:test
      - run: npm run app-images:build
      - run: npm run app-images:inspect
      - run: npm run app-images:sign
      - run: trivy image --cache-dir "$APP_IMAGE_TRIVY_CACHE_DIR" --download-db-only
      - run: trivy image --cache-dir "$APP_IMAGE_TRIVY_CACHE_DIR" --download-java-db-only
      - run: npm run app-images:scan
      - run: npm run app-images:record
      - name: Upload application image registry evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: application-image-registry-${{ inputs.release }}
          path: |
            dist/application-images/application-inspection.json
            dist/application-images/application-signing.json
            dist/application-images/application-images.env
            dist/application-images/application-images.json
            dist/application-images/application-security/**
            dist/application-images/.application-security.failed-*/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
