name: Piston image

on:
  pull_request:
    paths:
      - .github/workflows/piston-image.yml
      - infra/piston/**
      - infra/piston-interactive/**
      - compose.piston-interactive.yaml
      - src/lib/runner/**
      - services/interactive-runner/**
      - src/app/api/code/interactive/**
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - .github/workflows/piston-image.yml
      - infra/piston/**
      - infra/piston-interactive/**
      - compose.piston-interactive.yaml
      - src/lib/runner/**
      - services/interactive-runner/**
      - src/app/api/code/interactive/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install test dependencies
        run: |
          npm ci > npm-ci.log 2>&1 || { cat npm-ci.log; exit 1; }
          rm npm-ci.log
      - name: Check and fetch locked inputs
        run: |
          node --test infra/piston/prepare.test.mjs > inputs.log 2>&1 || { cat inputs.log; exit 1; }
          node infra/piston/prepare.mjs > downloads.log 2>&1 || { cat downloads.log; exit 1; }
          rm inputs.log downloads.log
      # Match the NUC: the containerd image store keeps the manifest digest as
      # RepoDigests and lets the docker driver export the rewrite-timestamp tarball.
      - name: Use the containerd image store
        run: |
          { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } \
            | jq '.features["containerd-snapshotter"] = true' > daemon.json
          sudo install -m 0644 daemon.json /etc/docker/daemon.json && rm daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | grep -F io.containerd.snapshotter.v1
      - name: Build twice without network access
        run: |
          node infra/piston/build.mjs codestead-piston:ci > build.log 2>&1 || { tail -n 120 build.log; exit 1; }
          mv infra/piston/build-metadata.json first-build-metadata.json
          node infra/piston/build.mjs --no-cache codestead-piston:ci > build.log 2>&1 || { tail -n 120 build.log; exit 1; }
          rm build.log
      - name: Require identical digests from both builds
        run: node infra/piston/verify-digest.mjs first-build-metadata.json infra/piston/build-metadata.json
      - name: Assert the reproducible CI batch parent pin
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; import { readFileSync } from 'node:fs'; const metadata = JSON.parse(readFileSync('infra/piston/build-metadata.json')); assert.equal(metadata['containerimage.digest'], 'sha256:7be3f3528a043b085dfc07a613892cd812c75bee0e60e69ffd0f015790ecdf40', 'CI batch parent differs from the reviewed reproducible pin');"
      - name: Test actual image and record its manifest
        run: |
          node infra/piston/test-image.mjs codestead-piston:ci > smoke.log 2>&1 || { cat smoke.log; exit 1; }
          rm smoke.log
      - name: Check interactive patch and isolated Compose addon
        run: |
          node --test infra/piston-interactive/*.test.mjs > interactive-contract.log 2>&1 || { tail -n 120 interactive-contract.log; exit 1; }
          node infra/piston-interactive/verify-handoff.mjs >> interactive-contract.log 2>&1 || { tail -n 120 interactive-contract.log; exit 1; }
          rm interactive-contract.log
      - name: Build interactive image twice and require identical digests
        run: |
          node infra/piston-interactive/build.mjs codestead-piston-interactive:ci codestead-piston:ci > interactive-build.log 2>&1 || { tail -n 120 interactive-build.log; exit 1; }
          cp infra/piston-interactive/build-metadata.json first-interactive-build.json
          node infra/piston-interactive/build.mjs --no-cache codestead-piston-interactive:ci codestead-piston:ci > interactive-build.log 2>&1 || { tail -n 120 interactive-build.log; exit 1; }
          node infra/piston/verify-digest.mjs first-interactive-build.json infra/piston-interactive/build-metadata.json
          rm interactive-build.log
      - name: Verify live interactive image behavior
        run: |
          node infra/piston-interactive/test-image.mjs codestead-piston-interactive:ci > interactive-live.log 2>&1 || { tail -n 120 interactive-live.log; exit 1; }
          rm interactive-live.log
      - name: Verify broker against real interactive and independent batch images
        run: |
          node --import tsx services/interactive-runner/test-image.mjs codestead-piston-interactive:ci codestead-piston:ci > broker-live.log 2>&1 || { tail -n 100 broker-live.log; exit 1; }
          rm broker-live.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piston-image-runtime-handoff
          path: |
            infra/piston/image-result.json
            infra/piston/build-metadata.json
            infra/piston-interactive/image-result.json
            infra/piston-interactive/build-metadata.json
          if-no-files-found: error
