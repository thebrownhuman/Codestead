# Throwaway spike workflow (branch spike/kata-piston only, never merged).
name: spike-kata-piston
on:
  push:
    branches: [spike/kata-piston]
permissions:
  contents: read
jobs:
  kata:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: bash infra/piston/spike/kata-spike.sh
      - run: bash infra/piston/spike/kata-compose.sh
