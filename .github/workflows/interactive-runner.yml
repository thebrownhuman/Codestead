name: Interactive runner contracts

on:
  pull_request:
    paths:
      - .github/workflows/interactive-runner.yml
      - services/interactive-runner/**
      - src/lib/runner/**
      - src/lib/exams/**
      - src/lib/privacy/**
      - src/lib/http/authz.ts
      - src/lib/security/**
      - src/app/api/code/**
      - src/app/api/exams/**
      - compose*.yaml
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - .github/workflows/interactive-runner.yml
      - services/interactive-runner/**
      - src/lib/runner/**
      - src/lib/exams/**
      - src/lib/privacy/**
      - src/lib/http/authz.ts
      - src/lib/security/**
      - src/app/api/code/**
      - src/app/api/exams/**
      - compose*.yaml
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Interactive runner transport and admission
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci > install.log 2>&1 || { tail -n 100 install.log; exit 1; }
      - name: Run transport and admission contracts
        run: npm run test:interactive-runner > contracts.log 2>&1 || { tail -n 100 contracts.log; exit 1; }
